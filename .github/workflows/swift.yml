---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-flight runs on the same ref when a new push lands.
# `github.ref` is the PR's merge ref on `pull_request` events and
# the branch ref on `push`, so PR pushes don't cancel main builds
# (different refs) but successive force-pushes to a PR do.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # macos-latest currently ships Xcode 16 / Swift 6.1; SwiftPorts
      # (and its `swift-configuration` dep) declare tools-version 6.2,
      # so we need a newer Xcode. 26.0 ships Swift 6.2.
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      # SwiftPorts' Bzip2Kit / ZstdKit need libbz2 / libzstd from
      # Homebrew on macOS — they're not in the SDK. xz / lz4 use
      # `Compression.framework` on Apple platforms, no brew needed.
      - name: Install C dependencies (Homebrew)
        run: |
          for pkg in bzip2 zstd; do
            brew list --versions "$pkg" >/dev/null 2>&1 \
              || brew install "$pkg"
          done
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      # JSC linkage smoke check — uses the system JavaScriptCore
      # framework on Apple. Mirror of the non-Apple verification
      # below so CI proves the same C-API path on every platform.
      - name: JSC smoke (macOS)
        run: .build/debug/swift-jsc-smoke
      # Research probe for oven-sh/bun#30434 — this run gives the
      # Apple baseline (every variant should complete within
      # milliseconds). Compare against the Linux output to localise
      # which path Bun's standalone-mode teardown breaks on.
      # macOS doesn't ship `timeout(1)`; install via coreutils so the
      # loop semantics match Linux (kernel-enforced cap per variant
      # plus per-variant exit codes printed for the data table).
      # Runs BEFORE the test step so a long / cancelled test phase
      # can't truncate the diag output (observed once when Linux
      # tests hit the 15 min job timeout and the diag step ran into
      # the cancellation grace period).
      - name: Install coreutils (for timeout)
        run: brew list --versions coreutils >/dev/null 2>&1 || brew install coreutils
      - name: JSC shutdown diagnostics (macOS)
        run: |
          set +e
          for variant in plain evaluated gc-then-release group-release no-release; do
            echo "::group::variant=$variant"
            gtimeout --preserve-status --kill-after=5s 20s \
              .build/debug/swift-jsc-shutdown-diag "$variant"
            echo "[exit=$?]"
            echo "::endgroup::"
          done
          exit 0
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    # Compile-only check on `generic/platform=iOS` (no simulator boots).
    # Catches API/portability breaks against the iOS SDK without paying
    # for a simulator phase. An iOS Simulator `xcodebuild test` step
    # was attempted but surfaces a separate class of issues (one test
    # hangs the simulator long enough to trigger xcodebuild's restart-
    # and-fail logic, even though a re-run passes); tracking that as
    # follow-up work rather than blocking this PR.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build (iOS — all package targets)
        run: |
          xcodebuild \
            -scheme SwiftBash-Package \
            -destination 'generic/platform=iOS' \
            build

  build-linux:
    # Linux: full build + test, parity with Apple platforms.
    # System requirements have grown since SwiftBash adopted
    # SwiftPorts: in addition to `zlib1g-dev`, the Bzip2Kit / XzKit
    # / ZstdKit / Lz4Kit C shims need their respective dev packages,
    # and libgit2 (consumed by SwiftPorts' SwiftGit) needs OpenSSL
    # headers + pkg-config to wire up TLS. xattr functions still
    # resolve via the local CXattr systemLibrary; `<sys/xattr.h>`
    # ships in the standard libc-dev set the swiftlang/swift
    # container already has.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install C dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config ca-certificates \
                                  zlib1g-dev libbz2-dev liblzma-dev \
                                  libzstd-dev liblz4-dev
      - name: Verify Swift version
        run: swift --version
      # Bun's prebuilt JavaScriptCore static archive (oven-sh/WebKit
      # autobuild). Stages headers + libJavaScriptCore.a etc. under
      # Vendor/bun-webkit/<triple>/, with a `current` symlink that
      # CJavaScriptCore's header / library search paths follow. Must
      # run before `swift build` so the linker resolves -lJavaScriptCore.
      - name: Fetch bun-webkit (Linux)
        run: ./scripts/fetch-bun-webkit.sh
      # Diagnostic — if the build fails on missing JSC headers,
      # this step's output reveals whether the fetch actually
      # produced them, where, and the absolute path the Package.swift
      # `bunWebKitDir` constant resolves to. Cheap insurance.
      - name: Inspect bun-webkit staging (Linux)
        run: |
          echo "PWD=$(pwd)"
          ls -la Vendor/bun-webkit/
          echo "---"
          ls -la Vendor/bun-webkit/current/ || true
          echo "---"
          ls -la Vendor/bun-webkit/current/include/JavaScriptCore/JavaScript.h
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: JSC smoke (Linux)
        run: .build/debug/swift-jsc-smoke
      # Research probe for oven-sh/bun#30434. Each variant is run
      # separately so a hang in one doesn't block the others. Both
      # the in-process 10 s watchdog AND an external `timeout 20s`
      # cap each invocation: when the bun-webkit teardown hangs the
      # main thread it can wedge stdio so badly the watchdog's own
      # `raise(SIGABRT)` doesn't escape — observed in the first run,
      # where `plain` froze and the bash for-loop never advanced. The
      # external `timeout` is enforced by the kernel and reliably
      # frees the loop so subsequent variants still get exercised.
      # `--preserve-status` propagates the binary's exit code (or 124
      # on timeout / 137 on SIGKILL after grace period) so we can
      # distinguish pass / hang / abort in the data table. Runs BEFORE
      # the test step so a long / cancelled test phase can't truncate
      # the diag output (observed once when Linux tests hit the 15 min
      # job timeout and the diag step ran into the cancellation grace
      # period).
      - name: JSC shutdown diagnostics (Linux)
        run: |
          set +e
          for variant in plain evaluated gc-then-release group-release no-release; do
            echo "::group::variant=$variant"
            timeout --preserve-status --kill-after=5s 20s \
              .build/debug/swift-jsc-shutdown-diag "$variant"
            echo "[exit=$?]"
            echo "::endgroup::"
          done
          # Step itself always succeeds; analyse via the per-variant
          # exit codes printed above.
          exit 0
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel

  build-windows:
    # Windows is a committed compatibility target — the build and
    # test steps fail the job on regression, same as the other
    # platforms. Tests that don't map to Windows (POSIX execute bit,
    # `bash FILE` with non-quoted host paths, etc.) carry their own
    # `#if !os(Windows)` gates at the source level.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.1"
      - name: Verify Swift version
        run: swift --version
      - name: Install C dependencies (vcpkg)
        # vcpkg is preinstalled on windows-latest at C:\vcpkg.
        # x64-windows-static-md gives us .lib files linked against
        # the dynamic UCRT, which matches Swift's default link mode.
        # SwiftPorts' Bzip2Kit / XzKit / ZstdKit / Lz4Kit C shims
        # are gated to non-Apple-mobile via per-target platforms,
        # but they DO compile on Windows and need their respective
        # libs available.
        #
        # zlib alias: SwiftPorts' CZlib modulemap declares `link "z"`
        # (mirroring libarchive's `linkedLibrary("z")`), which lld-link
        # translates to `z.lib`. vcpkg's `x64-windows-static-md` triplet
        # ships zlib as `zs.lib`; older triplets / releases shipped
        # `zlib.lib`. Either way we copy the chosen artifact to `z.lib`
        # so lld-link resolves cleanly. This mirrors the alias step in
        # the upstream SwiftPorts workflow.
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib bzip2 liblzma zstd lz4 --triplet x64-windows-static-md
          $base = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          Write-Host "vcpkg .lib inventory under $base (recursive):"
          Get-ChildItem "$base" -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          $candidates = @("zs.lib", "zlib.lib", "libzlib.lib", "libz.lib", "z.lib")
          $zlibLib = $null
          foreach ($name in $candidates) {
            $p = Join-Path "$base\lib" $name
            if (Test-Path $p) { $zlibLib = $p; break }
          }
          if (-not $zlibLib) {
            throw "no zlib library found under $base\lib (looked for: $($candidates -join ', '))"
          }
          Write-Host "Using zlib library: $zlibLib"
          if ($zlibLib -ne (Join-Path "$base\lib" "z.lib")) {
            Copy-Item -Force $zlibLib "$base\lib\z.lib"
          }
          "VCPKG_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Bun's prebuilt JavaScriptCore (oven-sh/WebKit autobuild —
      # the Windows MSVC variant ships .lib files directly). Same
      # role as the Linux fetch step. The script is bash; Git Bash
      # is preinstalled on windows-latest.
      - name: Fetch bun-webkit (Windows)
        shell: bash
        run: ./scripts/fetch-bun-webkit.sh
      - name: Build (Windows)
        shell: pwsh
        run: |
          swift build --build-tests -v `
            -Xcc "-I$env:VCPKG_BASE\include" `
            -Xlinker "/LIBPATH:$env:VCPKG_BASE\lib"
      - name: Test (Windows)
        shell: pwsh
        run: |
          swift test -v --skip-build --no-parallel `
            -Xcc "-I$env:VCPKG_BASE\include" `
            -Xlinker "/LIBPATH:$env:VCPKG_BASE\lib"
      - name: JSC smoke (Windows)
        shell: pwsh
        run: .\.build\debug\swift-jsc-smoke.exe

  # Uses skiptools/swift-android-action which wraps the swift.org Android
  # SDK setup AND runs the SwiftPM tests on an x86_64 Android emulator.
  # No `container:` here — the action provisions its own toolchain and
  # the emulator setup needs nested KVM, which only works on the bare
  # ubuntu-* runner image.
  #
  # Single action invocation: the action's emulator + test steps are
  # gated on `build-package == build-tests == run-tests == 'true'`
  # (see action.yml), so a split "build first / test second" pair makes
  # the second call a no-op. Keep build + test in one step.
  build-android:
    runs-on: ubuntu-latest
    # First cold run = ~25 min (SDK + NDK + emulator boot dominates);
    # cached subsequent runs are ~5 min. 30 min covers both with a
    # comfortable margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # Bun's Android-targeted JSC archive. Cross-build from the
      # ubuntu-latest x86_64 host into the Android emulator's
      # arch — the action's default emulator is x86_64 / amd64,
      # so we pin the matching tarball explicitly. Runs before the
      # action because Package.swift's bunWebKitFetched probe reads
      # the path during package resolution.
      - name: Fetch bun-webkit (Android target)
        env:
          BUN_WEBKIT_ASSET: bun-webkit-linux-amd64-android.tar.gz
        run: ./scripts/fetch-bun-webkit.sh
      - name: Build & Test (Android emulator)
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.3"
          # The default GitHub Linux runner has ~14 GiB free; the SDK,
          # NDK, and emulator together push past that without cleanup.
          free-disk-space: true
