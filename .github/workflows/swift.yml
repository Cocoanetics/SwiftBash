---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build (iOS — all package targets)
        run: |
          xcodebuild \
            -scheme SwiftBash-Package \
            -destination 'generic/platform=iOS' \
            build

  build-linux:
    # Linux support is in-progress. Several modules currently
    # depend on Apple-only APIs that need #if guards or
    # cross-platform alternatives:
    #   - NetworkFetcher.swift:   URLSession lives in
    #     FoundationNetworking on Linux (just needs an extra import)
    #   - RealFileSystem.swift:   Darwin.* C calls (chmod / chown /
    #     symlink / link / *xattr) need Glibc.* fallbacks; stat
    #     timespec fields are spelled st_mtim, st_atim, st_ctim
    #   - Compression framework:  used by gzip / gunzip (Apple-only)
    #   - CryptoKit:              md5 / sha* commands (use
    #     swift-crypto for Linux parity)
    #
    # `continue-on-error: true` keeps the badge green while the
    # gaps land — the failure list above is the punch list to work
    # through.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel
