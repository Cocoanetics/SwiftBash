---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build (iOS — all package targets)
        run: |
          xcodebuild \
            -scheme SwiftBash-Package \
            -destination 'generic/platform=iOS' \
            build

  build-linux:
    # Linux: full build + test. One small system requirement —
    # `zlib1g-dev` (the libz development headers) — needed by the
    # CZlib system-library target that gzip / gunzip wrap. The
    # runtime libz is preinstalled on Ubuntu; only the headers
    # need adding for SwiftPM compilation.
    #
    # Remaining limitation: extended attributes are no-op on Linux
    # (the `<sys/xattr.h>` symbols aren't in Swift's default Glibc
    # module). XattrCommandTests is `#if canImport(Darwin)`-gated.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install zlib headers
        run: sudo apt-get install -y zlib1g-dev
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel
