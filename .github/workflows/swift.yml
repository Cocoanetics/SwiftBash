---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build (iOS — all package targets)
        run: |
          xcodebuild \
            -scheme SwiftBash-Package \
            -destination 'generic/platform=iOS' \
            build

  build-linux:
    # Linux: full build + test, parity with Apple platforms.
    # Only system requirement is `zlib1g-dev` for CZlib's modulemap
    # (the runtime libz is preinstalled). xattr functions resolve
    # through the local CXattr systemLibrary target — no extra apt
    # install needed; `<sys/xattr.h>` ships in the standard Linux
    # libc-dev set that swiftlang/swift's container already has.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install zlib headers
        run: sudo apt-get install -y zlib1g-dev
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel
