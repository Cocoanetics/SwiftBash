---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build (iOS — all package targets)
        run: |
          xcodebuild \
            -scheme SwiftBash-Package \
            -destination 'generic/platform=iOS' \
            build

  build-linux:
    # Linux: full build + test, parity with Apple platforms.
    # Only system requirement is `zlib1g-dev` for CZlib's modulemap
    # (the runtime libz is preinstalled). xattr functions resolve
    # through the local CXattr systemLibrary target — no extra apt
    # install needed; `<sys/xattr.h>` ships in the standard Linux
    # libc-dev set that swiftlang/swift's container already has.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install zlib headers
        run: sudo apt-get install -y zlib1g-dev
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel

  build-windows:
    # Investigation job: Windows support is not yet a committed
    # compatibility target, so collect compiler/test failures without
    # blocking existing macOS / iOS / Linux CI.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Setup Swift
        uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3.1"
      - name: Verify Swift version
        run: swift --version
      - name: Install zlib (vcpkg)
        # vcpkg is preinstalled on windows-latest at C:\vcpkg.
        # x64-windows-static-md gives us a `zlib.lib` linked against
        # the dynamic UCRT, which matches Swift's default link mode.
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install zlib --triplet x64-windows-static-md
      - name: Build (Windows)
        shell: pwsh
        run: |
          $base = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          swift build --build-tests -v `
            -Xcc "-I$base\include" `
            -Xlinker "/LIBPATH:$base\lib"
        continue-on-error: true
      - name: Test (Windows)
        shell: pwsh
        run: |
          $base = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          swift test -v --skip-build --no-parallel `
            -Xcc "-I$base\include" `
            -Xlinker "/LIBPATH:$base\lib"
        continue-on-error: true
