---
name: Swift
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        run: swift test -v --skip-build --no-parallel

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Build (iOS — all package targets)
        run: |
          xcodebuild \
            -scheme SwiftBash-Package \
            -destination 'generic/platform=iOS' \
            build

  build-linux:
    # Linux support: full build + test. Two known limitations
    # currently — neither blocks normal scripts:
    #   - gzip / gunzip aren't registered (no Compression framework
    #     on Linux yet; needs a zlib shim).
    #   - extended attributes are no-op (sys/xattr.h symbols aren't
    #     in Swift's default Glibc module; needs a tiny C target).
    # Tests for both are gated with #if canImport(...) and skip on
    # Linux. Drop the gates when the underlying gaps land.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift version
        run: swift --version
      - name: Build (Linux)
        run: swift build --build-tests -v
      - name: Test (Linux)
        run: swift test -v --skip-build --no-parallel
