---
name: Dependency drift
# PR CI builds the exact revisions in `Package.resolved`, so it no
# longer notices when a *compatible* upstream release (a new ShellKit /
# SwiftPorts / SwiftScript patch within the pinned minor) breaks us —
# nobody sees that until someone runs `swift package update` by hand.
# This job does that on a schedule, against a throwaway resolution,
# and fails loudly if the moved graph doesn't build and pass. It never
# commits; picking up the release is still an explicit `deps:` PR
# (see AGENTS.md → Dependencies).
on:
  schedule:
    # Mondays 06:00 UTC — after a weekend of upstream merges, before
    # the week's PRs start resolving against stale assumptions.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-and-test:
    # Same image / toolchain / brew deps as `build-macos` in swift.yml;
    # keep the two in step.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"
      - name: Verify Swift version
        shell: bash
        run: |
          status=0
          version="$(swift --version 2>&1)" || status=$?
          printf '%s\n' "$version"
          [ "$status" -eq 0 ] || exit "$status"
          printf '%s\n' "$version" | grep -Eq '(^|[[:space:]])Swift version 6[.]4([.][0-9]+)*([[:space:]]|$)'
      - name: Install C dependencies (Homebrew)
        run: |
          for pkg in bzip2 zstd; do
            brew list --versions "$pkg" >/dev/null 2>&1 \
              || brew install "$pkg"
          done
      - name: Move every dependency to its newest allowed release
        run: |
          cp Package.resolved /tmp/Package.resolved.pinned
          swift package update
          echo "::group::Package.resolved diff (pinned → newest)"
          diff -u /tmp/Package.resolved.pinned Package.resolved \
            && echo "no dependency moved" || true
          echo "::endgroup::"
      - name: Build (macOS)
        run: swift build --build-tests -v
      - name: Test (macOS)
        # Unassisted, same as swift.yml (#116).
        run: swift test -v --skip-build --no-parallel
